<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect width="200" height="400" rx="20" fill="#1a1b26"/>
  <rect x="10" y="30" width="180" height="340" rx="15" fill="#ffffff"/>
  
  <!-- Status Bar -->
  <rect x="10" y="30" width="180" height="30" rx="15" fill="#f8f9fa"/>
  <circle cx="25" cy="45" r="3" fill="#48bb78"/>
  <rect x="30" y="42" width="20" height="6" rx="3" fill="#333"/>
  <rect x="160" y="42" width="20" height="6" rx="3" fill="#333"/>
  
  <!-- Header -->
  <rect x="10" y="60" width="180" height="50" fill="#667eea"/>
  <rect x="20" y="75" width="80" height="20" rx="10" fill="rgba(255,255,255,0.3)"/>
  <circle cx="170" cy="85" r="8" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Content Area -->
  <rect x="20" y="130" width="160" height="15" rx="7" fill="#e2e8f0"/>
  <rect x="20" y="155" width="120" height="15" rx="7" fill="#e2e8f0"/>
  <rect x="20" y="180" width="140" height="15" rx="7" fill="#e2e8f0"/>
  
  <!-- Cards -->
  <rect x="20" y="210" width="160" height="60" rx="10" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="30" y="220" width="40" height="40" rx="5" fill="#667eea"/>
  <rect x="80" y="225" width="80" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="80" y="240" width="60" height="10" rx="5" fill="#e2e8f0"/>
  
  <rect x="20" y="280" width="160" height="60" rx="10" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="30" y="290" width="40" height="40" rx="5" fill="#f093fb"/>
  <rect x="80" y="295" width="80" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="80" y="310" width="60" height="10" rx="5" fill="#e2e8f0"/>
  
  <!-- Bottom Navigation -->
  <rect x="10" y="350" width="180" height="20" fill="#f8f9fa"/>
  <circle cx="50" cy="360" r="6" fill="#667eea"/>
  <circle cx="100" cy="360" r="6" fill="#e2e8f0"/>
  <circle cx="150" cy="360" r="6" fill="#e2e8f0"/>
</svg>