<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect width="200" height="400" rx="20" fill="#1a1b26"/>
  <rect x="10" y="30" width="180" height="340" rx="15" fill="#ffffff"/>
  
  <!-- Status Bar -->
  <rect x="10" y="30" width="180" height="30" rx="15" fill="#f8f9fa"/>
  <circle cx="25" cy="45" r="3" fill="#48bb78"/>
  <rect x="30" y="42" width="20" height="6" rx="3" fill="#333"/>
  <rect x="160" y="42" width="20" height="6" rx="3" fill="#333"/>
  
  <!-- Header -->
  <rect x="10" y="60" width="180" height="50" fill="#48bb78"/>
  <rect x="20" y="75" width="50" height="20" rx="10" fill="rgba(255,255,255,0.3)"/>
  <circle cx="170" cy="85" r="8" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Cart Items -->
  <rect x="20" y="130" width="160" height="50" rx="10" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="30" y="140" width="30" height="30" rx="5" fill="#e2e8f0"/>
  <rect x="70" y="145" width="80" height="8" rx="4" fill="#2d3748"/>
  <rect x="70" y="158" width="50" height="6" rx="3" fill="#48bb78"/>
  <rect x="150" y="145" width="20" height="8" rx="4" fill="#ed8936"/>
  
  <rect x="20" y="190" width="160" height="50" rx="10" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="30" y="200" width="30" height="30" rx="5" fill="#e2e8f0"/>
  <rect x="70" y="205" width="80" height="8" rx="4" fill="#2d3748"/>
  <rect x="70" y="218" width="50" height="6" rx="3" fill="#48bb78"/>
  <rect x="150" y="205" width="20" height="8" rx="4" fill="#ed8936"/>
  
  <!-- Total Section -->
  <rect x="20" y="260" width="160" height="40" rx="10" fill="#667eea"/>
  <rect x="30" y="270" width="60" height="10" rx="5" fill="rgba(255,255,255,0.3)"/>
  <rect x="120" y="270" width="50" height="10" rx="5" fill="rgba(255,255,255,0.8)"/>
  <rect x="30" y="285" width="40" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Checkout Button -->
  <rect x="30" y="320" width="140" height="40" rx="20" fill="#48bb78"/>
  <rect x="70" y="335" width="60" height="10" rx="5" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Bottom Navigation -->
  <rect x="10" y="350" width="180" height="20" fill="#f8f9fa"/>
  <circle cx="50" cy="360" r="6" fill="#e2e8f0"/>
  <circle cx="100" cy="360" r="6" fill="#e2e8f0"/>
  <circle cx="150" cy="360" r="6" fill="#48bb78"/>
</svg>