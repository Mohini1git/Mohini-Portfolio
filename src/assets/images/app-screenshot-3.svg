<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect width="200" height="400" rx="20" fill="#1a1b26"/>
  <rect x="10" y="30" width="180" height="340" rx="15" fill="#ffffff"/>
  
  <!-- Status Bar -->
  <rect x="10" y="30" width="180" height="30" rx="15" fill="#f8f9fa"/>
  <circle cx="25" cy="45" r="3" fill="#48bb78"/>
  <rect x="30" y="42" width="20" height="6" rx="3" fill="#333"/>
  <rect x="160" y="42" width="20" height="6" rx="3" fill="#333"/>
  
  <!-- Header -->
  <rect x="10" y="60" width="180" height="50" fill="#4facfe"/>
  <rect x="20" y="75" width="70" height="20" rx="10" fill="rgba(255,255,255,0.3)"/>
  <circle cx="170" cy="85" r="8" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Profile Section -->
  <circle cx="100" cy="150" r="30" fill="#e2e8f0"/>
  <rect x="70" y="190" width="60" height="12" rx="6" fill="#2d3748"/>
  <rect x="80" y="210" width="40" height="8" rx="4" fill="#a0aec0"/>
  
  <!-- Stats -->
  <rect x="30" y="240" width="40" height="30" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="35" y="250" width="30" height="6" rx="3" fill="#48bb78"/>
  <rect x="35" y="260" width="20" height="4" rx="2" fill="#a0aec0"/>
  
  <rect x="80" y="240" width="40" height="30" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="85" y="250" width="30" height="6" rx="3" fill="#ed8936"/>
  <rect x="85" y="260" width="20" height="4" rx="2" fill="#a0aec0"/>
  
  <rect x="130" y="240" width="40" height="30" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
  <rect x="135" y="250" width="30" height="6" rx="3" fill="#4299e1"/>
  <rect x="135" y="260" width="20" height="4" rx="2" fill="#a0aec0"/>
  
  <!-- Action Buttons -->
  <rect x="30" y="300" width="140" height="35" rx="17" fill="#667eea"/>
  <rect x="50" y="310" width="100" height="15" rx="7" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Bottom Navigation -->
  <rect x="10" y="350" width="180" height="20" fill="#f8f9fa"/>
  <circle cx="50" cy="360" r="6" fill="#e2e8f0"/>
  <circle cx="100" cy="360" r="6" fill="#e2e8f0"/>
  <circle cx="150" cy="360" r="6" fill="#4facfe"/>
</svg>